services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION:?Defina PHP_VERSION em php/.env}"
    container_name: php_global
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHP_RUNTIME_PORT:?Defina PHP_RUNTIME_PORT em php/.env}:80"
    volumes:
      - ./www/index.php:/var/www/html/index.php:ro
      - ./www/.htaccess:/var/www/html/.htaccess:ro
      - ./shared:/var/www/html/shared:ro
      - ./app:/var/www/html/app
      - ./app_nf:/var/www/html/app_nf
      - ./app_sistema:/var/www/html/app_sistema
      - ./gsfacilFront:/var/www/html/gsfacilfront
      - ./googlecalendar:/var/www/html/googlecalendar
      - ./peoplecontacts:/var/www/html/peoplecontacts
      - ./gallosoundsite:/var/www/html/gallosoundsite:ro
      - php_sessions:/tmp/php-sessions
    environment:
      TZ: America/Sao_Paulo
      APP_ENV: "${APP_ENV:?Defina APP_ENV em php/.env}"
      PATH_SISTEMA: "${PATH_SISTEMA:?Defina PATH_SISTEMA em php/.env}"
      DB_DRIVER: "${DB_DRIVER:?Defina DB_DRIVER em php/.env}"
      DB_HOST: "${DB_HOST:?Defina DB_HOST em php/.env}"
      DB_DATABASE: "${DB_DATABASE:?Defina DB_DATABASE em php/.env}"
      DB_USER: "${DB_USER:?Defina DB_USER em php/.env}"
      DB_PASS: "${DB_PASS:?Defina DB_PASS em php/.env}"
      API_SECRET_KEY: "${API_SECRET_KEY:-}"
      APP_BASE_URL_APP: "${APP_BASE_URL_APP:?Defina APP_BASE_URL_APP em php/.env}"
      APP_BASE_URL_APP_NF: "${APP_BASE_URL_APP_NF:?Defina APP_BASE_URL_APP_NF em php/.env}"
      APP_BASE_URL: "${APP_BASE_URL:?Defina APP_BASE_URL em php/.env}"
      APP_BASE_URL_NEW: "${APP_BASE_URL_NEW:?Defina APP_BASE_URL_NEW em php/.env}"
      APP_BASE_URL_PEOPLECONTACTS: "${APP_BASE_URL_PEOPLECONTACTS:?Defina APP_BASE_URL_PEOPLECONTACTS em php/.env}"
      APP_BASE_URL_GALLOSOUNDSITE: "${APP_BASE_URL_GALLOSOUNDSITE:?Defina APP_BASE_URL_GALLOSOUNDSITE em php/.env}"
      BASE_DIR: "${BASE_DIR:?Defina BASE_DIR em php/.env}"
      BASE_URL_IMAGES: "${BASE_URL_IMAGES:?Defina BASE_URL_IMAGES em php/.env}"
      BASE_APP: "${BASE_APP:?Defina BASE_APP em php/.env}"
      BASE_API_GSFACIL: "${BASE_API_GSFACIL:-}"
      BASE_API_RASTREIO: "${BASE_API_RASTREIO:-}"
      INTERNAL_API_URL: "${INTERNAL_API_URL:?Defina INTERNAL_API_URL em php/.env}"
      INTERNAL_API_TIMEOUT: "${INTERNAL_API_TIMEOUT:-20}"
      BASE_URL_API_CONTACTS: "${BASE_URL_API_CONTACTS:?Defina BASE_URL_API_CONTACTS em php/.env}"
      BASE_URL_API_PEOPLECONTACTS: "${BASE_URL_API_PEOPLECONTACTS:?Defina BASE_URL_API_PEOPLECONTACTS em php/.env}"
      # OAuth Google: obrigatório só em APP_ENV=production (entrypoint). No Mac pode ficar vazio.
      GOOGLE_CALENDAR_CLIENT_ID: "${GOOGLE_CALENDAR_CLIENT_ID:-}"
      GOOGLE_CALENDAR_CLIENT_SECRET: "${GOOGLE_CALENDAR_CLIENT_SECRET:-}"
      GOOGLE_CALENDAR_REDIRECT_URI: "${GOOGLE_CALENDAR_REDIRECT_URI:-}"
      GOOGLE_CALENDAR_TOKEN_PATH: "${GOOGLE_CALENDAR_TOKEN_PATH:-}"
      GOOGLE_CONTACTS_CLIENT_ID: "${GOOGLE_CONTACTS_CLIENT_ID:-}"
      GOOGLE_CONTACTS_CLIENT_SECRET: "${GOOGLE_CONTACTS_CLIENT_SECRET:-}"
      GOOGLE_CONTACTS_REFRESH_TOKEN: "${GOOGLE_CONTACTS_REFRESH_TOKEN:-}"
      GOOGLE_CONTACTS_REDIRECT_URI: "${GOOGLE_CONTACTS_REDIRECT_URI:-}"
      GOOGLE_CONTACTS_TOKEN_PATH: "${GOOGLE_CONTACTS_TOKEN_PATH:-}"
    networks:
      - rede-banco-global

networks:
  rede-banco-global:
    external: true
    name: "${DOCKER_NETWORK:?Defina DOCKER_NETWORK em php/.env}"

volumes:
  php_sessions:
