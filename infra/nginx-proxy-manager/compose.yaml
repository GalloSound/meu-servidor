services:
  npm_db:
    image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
    container_name: npm_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      MYSQL_ROOT_PASSWORD: "${NPM_DB_ROOT_PASSWORD:?Defina NPM_DB_ROOT_PASSWORD no .env desta stack}"
      MYSQL_DATABASE: "${NPM_DB_NAME:?Defina NPM_DB_NAME no .env desta stack}"
      MYSQL_USER: "${NPM_DB_USER:?Defina NPM_DB_USER no .env desta stack}"
      MYSQL_PASSWORD: "${NPM_DB_PASSWORD:?Defina NPM_DB_PASSWORD no .env desta stack}"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - npm-internal
    # Sem "ports": banco acessivel somente pela rede interna desta stack.

  nginx_proxy_manager:
    image: jc21/nginx-proxy-manager:2.15.1@sha256:52b2c59994f3d36acfcf70a1626f29734df0ed8c71bacc0269f78b6f939858bb
    container_name: nginx_proxy_manager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      npm_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "${NPM_HTTP_BIND:?Defina NPM_HTTP_BIND no .env desta stack}:${NPM_HTTP_PORT:?Defina NPM_HTTP_PORT no .env desta stack}:80"
      - "${NPM_HTTPS_BIND:?Defina NPM_HTTPS_BIND no .env desta stack}:${NPM_HTTPS_PORT:?Defina NPM_HTTPS_PORT no .env desta stack}:443"
      - "127.0.0.1:${NPM_ADMIN_PORT:?Defina NPM_ADMIN_PORT no .env desta stack}:81"
    environment:
      DB_MYSQL_HOST: npm_db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "${NPM_DB_USER:?Defina NPM_DB_USER no .env desta stack}"
      DB_MYSQL_PASSWORD: "${NPM_DB_PASSWORD:?Defina NPM_DB_PASSWORD no .env desta stack}"
      DB_MYSQL_NAME: "${NPM_DB_NAME:?Defina NPM_DB_NAME no .env desta stack}"
    volumes:
      - ./data/npm:/data
      - ./data/letsencrypt:/etc/letsencrypt
    networks:
      - npm-internal
      - rede-proxy-global

networks:
  npm-internal:
    name: npm-internal
    driver: bridge
    internal: true

  rede-proxy-global:
    external: true
    name: "${DOCKER_PROXY_NETWORK:?Defina DOCKER_PROXY_NETWORK no .env desta stack}"
