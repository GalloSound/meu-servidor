x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

x-mariadb-caps: &mariadb-caps
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

x-apache-caps: &apache-caps
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - NET_BIND_SERVICE
    - SETGID
    - SETUID

services:
  mariadb:
    image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
    container_name: mariadb_global
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    <<: [*no-new-privileges, *mariadb-caps]
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Defina MARIADB_ROOT_PASSWORD em infra/.env}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:?Defina MARIADB_DATABASE em infra/.env}"
    volumes:
      - ./data:/var/lib/mysql:Z
      - ./mariadb.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - rede-banco-global
    # Sem a diretiva "ports", o banco fica 100% isolado do mundo externo.
    # Apenas containers na rede DB conseguem falar com ele.

  phpmyadmin:
    image: phpmyadmin:5.2@sha256:9e915766488a0f603183367a4b51f5db6309ea801f3eaa25138a83815772b14f
    container_name: phpmyadmin_global
    restart: always
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/panel-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./docker/panel-healthcheck.sh:/usr/local/bin/panel-healthcheck:ro
    <<: [*no-new-privileges, *apache-caps]
    environment:
      PMA_HOST: mariadb_global
      PMA_PORT: 3306
      UPLOAD_LIMIT: 512M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: 600
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:?Defina PHPMYADMIN_PORT em infra/.env}:80"
    networks:
      - rede-banco-global
    depends_on:
      mariadb:
        condition: service_healthy

  filebrowser:
    image: filebrowser/filebrowser:v2-s6@sha256:ee4ac79e52966a5f6247f99c7d667c1debfb277a3a61ab829f505aa8f4c74b21
    container_name: filebrowser_global
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - admin-tools
    <<: *no-new-privileges
    ports:
      - "127.0.0.1:${FILEBROWSER_PORT:?Defina FILEBROWSER_PORT em infra/.env}:80"
    environment:
      PUID: "${FILEBROWSER_PUID:?Defina FILEBROWSER_PUID em infra/.env}"
      PGID: "${FILEBROWSER_PGID:?Defina FILEBROWSER_PGID em infra/.env}"
      TZ: America/Sao_Paulo
    volumes:
      - ../php:/srv/php:ro
      - ../docs:/srv/docs:ro
      - ./filebrowser/database:/database
      - ./filebrowser/config:/config
    # Fora da rede DB e da rede proxy. Nao sobe no up -d padrao.
    # Producao: nao use --profile admin-tools.

networks:
  rede-banco-global:
    driver: bridge
    name: "${DOCKER_NETWORK:?Defina DOCKER_NETWORK em infra/.env}"
