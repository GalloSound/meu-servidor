services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb_global
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Defina MARIADB_ROOT_PASSWORD em infra/.env}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:?Defina MARIADB_DATABASE em infra/.env}"
    volumes:
      - ./data:/var/lib/mysql:Z
      - ./mariadb.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - rede-banco-global
    # Sem a diretiva "ports", o banco fica 100% isolado do mundo externo.
    # Apenas containers na mesma rede conseguem falar com ele.

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: phpmyadmin_global
    restart: always
    environment:
      PMA_HOST: mariadb_global
      PMA_PORT: 3306
      UPLOAD_LIMIT: 512M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: 600
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:?Defina PHPMYADMIN_PORT em infra/.env}:80"
    networks:
      - rede-banco-global
    depends_on:
      - mariadb

  filebrowser:
    image: filebrowser/filebrowser:v2-s6
    container_name: filebrowser_global
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FILEBROWSER_PORT:?Defina FILEBROWSER_PORT em infra/.env}:80"
    environment:
      PUID: "${FILEBROWSER_PUID:?Defina FILEBROWSER_PUID em infra/.env}"
      PGID: "${FILEBROWSER_PGID:?Defina FILEBROWSER_PGID em infra/.env}"
      TZ: America/Sao_Paulo
    volumes:
      - ..:/srv/meu-servidor
      - ./filebrowser/database:/database
      - ./filebrowser/config:/config
    # Sem rede-banco-global: Filebrowser não precisa falar com MariaDB/PHP.

networks:
  rede-banco-global:
    driver: bridge
    name: "${DOCKER_NETWORK:?Defina DOCKER_NETWORK em infra/.env}"

# PHP
# $host = 'mariadb_global'; // O Docker resolve o nome do container como IP automaticamente!
# $db   = 'gpsjundi_bdgsfacil'; // Ajuste MARIADB_DATABASE e DB_DATABASE no .env de cada stack
